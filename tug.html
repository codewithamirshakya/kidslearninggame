<script>
const PULL_CORRECT = 10, PULL_WRONG = 3, ROUND_TIME = 15;
let state = { ropePos: 50, scores: {p1:0,p2:0}, questions: {p1:null,p2:null}, answered: {p1:false,p2:false}, inputs: {p1:'',p2:''}, timer: ROUND_TIME, names: {p1:'1st Team',p2:'2nd Team'}, gameOver: false };
let timerInterval = null;

function genQ() {
  const a = Math.floor(Math.random()*9)+2, b = Math.floor(Math.random()*9)+2;
  return {a, b, answer: a*b};
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function setRopePos(pos) {
  state.ropePos = Math.max(5, Math.min(95, pos));
  const pct = state.ropePos;
  const scene = document.getElementById('tug-scene');
  const sceneW = scene ? scene.offsetWidth : 300;
  const ropeLeft = sceneW * 0.14, ropeRight = sceneW * 0.86;
  const flagLeft = ropeLeft + (pct/100) * (ropeRight - ropeLeft);
  document.getElementById('flag-el').style.left = flagLeft + 'px';
  const fc = document.getElementById('flag-cloth');
  fc.style.background = pct < 46 ? '#4a90d9' : pct > 54 ? '#e05a5a' : '#f5a623';
  document.getElementById('prog-fill').style.width = pct + '%';
  const p1Lean = pct > 52 ? -10 : pct < 48 ? 8 : 0;
  const p2Lean = pct < 48 ? 10 : pct > 52 ? -8 : 0;
  document.getElementById('fig-p1').style.transform = `translateX(-50%) rotate(${p1Lean}deg)`;
  document.getElementById('fig-p2').style.transform = `translateX(-50%) rotate(${p2Lean}deg)`;
}
function updateScoreDisplay() {
  ['p1','p2'].forEach(p => {
    document.getElementById('pscore-'+p).textContent = state.scores[p];
    document.getElementById('sbar-'+p+'score').textContent = state.scores[p];
  });
}
function updateAnswerDisplay(player) {
  const el = document.getElementById('ans-'+player);
  el.textContent = state.inputs[player] || '';
  el.style.color = state.inputs[player] ? (player==='p1'?'#e05a5a':'#4a90d9') : '#ccc';
}
function setTimerDisplay(t) {
  const el = document.getElementById('timer-display');
  el.textContent = String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  const color = t<=5?'#e05a5a': t<=9?'#f5a623':'#4a90d9';
  el.style.color = color; el.style.background = color+'18';
  el.style.animation = t<=5 ? 'timerPulse 0.5s ease infinite' : 'none';
}
function triggerFlash(player, type) {
  const overlay = document.getElementById('flash-'+type+'-'+player);
  const icon = document.getElementById('flash-icon-'+player);
  overlay.classList.remove('do-flash'); icon.classList.remove('do-float');
  void overlay.offsetWidth; void icon.offsetWidth;
  overlay.classList.add('do-flash');
  icon.textContent = type==='correct' ? '✅' : '❌';
  icon.classList.add('do-float');
  setTimeout(() => { overlay.classList.remove('do-flash'); icon.classList.remove('do-float'); }, 800);
}
function setDisabled(player, disabled) {
  document.querySelectorAll(`.numpad-btn[data-player="${player}"]`).forEach(b => b.disabled = disabled);
}
function newRound() {
  if (state.gameOver) return;
  state.questions.p1 = genQ(); state.questions.p2 = genQ();
  state.answered = {p1:false,p2:false}; state.inputs = {p1:'',p2:''};
  state.timer = ROUND_TIME;
  ['p1','p2'].forEach(p => {
    const q = state.questions[p];
    document.getElementById('pq-'+p).textContent = q.a+' × '+q.b+' = ?';
    updateAnswerDisplay(p); setDisabled(p, false);
  });
  setTimerDisplay(state.timer);
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (state.gameOver) { clearInterval(timerInterval); return; }
    state.timer--;
    setTimerDisplay(state.timer);
    if (state.timer <= 0) newRound();
  }, 1000);
}
function handleAnswer(player) {
  if (state.answered[player] || state.gameOver) return;
  const val = parseInt(state.inputs[player], 10);
  if (isNaN(val)) return;
  const q = state.questions[player];
  const correct = val === q.answer;
  state.answered[player] = true; setDisabled(player, true);
  triggerFlash(player, correct ? 'correct' : 'wrong');
  if (correct) { state.scores[player]++; updateScoreDisplay(); }
  const delta = correct ? (player==='p1'?PULL_CORRECT:-PULL_CORRECT) : (player==='p1'?-PULL_WRONG:PULL_WRONG);
  setRopePos(state.ropePos + delta);
  if (state.ropePos >= 88) { setTimeout(() => endGame('p1'), 500); return; }
  if (state.ropePos <= 12) { setTimeout(() => endGame('p2'), 500); return; }
  if (state.answered.p1 && state.answered.p2) setTimeout(newRound, 900);
}
function endGame(winner) {
  state.gameOver = true; clearInterval(timerInterval);
  document.getElementById('winner-name').textContent = state.names[winner];
  document.getElementById('winner-name').style.color = winner==='p1'?'#e05a5a':'#4a90d9';
  document.getElementById('fs-p1val').textContent = state.scores.p1;
  document.getElementById('fs-p2val').textContent = state.scores.p2;
  showScreen('screen-gameover');
}
function applyNames() {
  state.names.p1 = document.getElementById('name-p1').value || '1st Team';
  state.names.p2 = document.getElementById('name-p2').value || '2nd Team';
  ['p1','p2'].forEach(p => {
    document.getElementById('pname-'+p).textContent = state.names[p];
    document.getElementById('sbar-'+p+'name').textContent = state.names[p];
    document.getElementById('prog-'+p+'label').textContent = state.names[p];
    document.getElementById('fs-'+p+'name').textContent = state.names[p];
  });
}
function startGame() {
  state.gameOver = false; state.scores = {p1:0,p2:0}; state.inputs = {p1:'',p2:''};
  setRopePos(50); updateScoreDisplay();
  showScreen('screen-game'); newRound(); startTimer();
}
document.getElementById('start-btn').addEventListener('click', () => { applyNames(); startGame(); });
document.getElementById('play-again-btn').addEventListener('click', () => { applyNames(); startGame(); });
document.getElementById('menu-btn').addEventListener('click', () => { clearInterval(timerInterval); showScreen('screen-lobby'); });
document.querySelectorAll('.numpad-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const p = btn.dataset.player, v = btn.dataset.val;
    if (state.answered[p] || state.gameOver) return;
    if (v==='clear') { state.inputs[p]=''; updateAnswerDisplay(p); return; }
    if (v==='submit') { handleAnswer(p); return; }
    if (state.inputs[p].length < 4) { state.inputs[p]+=v; updateAnswerDisplay(p); }
  });
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('screen-game').classList.contains('active')) return;
  const p2map = {'q':'1','w':'2','e':'3','a':'4','s':'5','d':'6','z':'7','x':'8','c':'9','v':'0','r':'clear','t':'submit'};
  const p1map = {'u':'1','i':'2','o':'3','j':'4','k':'5','l':'6','m':'7',',':'8','.':'9','n':'0','p':'clear','enter':'submit'};
  const key = e.key.toLowerCase();
  if (p2map[key] && !state.answered.p2 && !state.gameOver) { const v=p2map[key]; if(v==='clear'){state.inputs.p2='';updateAnswerDisplay('p2');}else if(v==='submit'){handleAnswer('p2');}else if(state.inputs.p2.length<4){state.inputs.p2+=v;updateAnswerDisplay('p2');} }
  if (p1map[key] && !state.answered.p1 && !state.gameOver) { const v=p1map[key]; if(v==='clear'){state.inputs.p1='';updateAnswerDisplay('p1');}else if(v==='submit'){handleAnswer('p1');}else if(state.inputs.p1.length<4){state.inputs.p1+=v;updateAnswerDisplay('p1');} }
});
window.addEventListener('load', () => setRopePos(50));
window.addEventListener('resize', () => setRopePos(state.ropePos));
</script>
